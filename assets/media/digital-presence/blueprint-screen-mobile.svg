<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#151515"/>
  <rect width="800" height="600" fill="url(#grid3)"/>

  <!-- Mobile Viewport Showcase -->
  <!-- Phone Frame 1: Mobile UI -->
  <g transform="translate(60, 40)">
    <rect width="250" height="510" fill="#181816" stroke="#2C2C28" stroke-width="2" rx="28"/>
    <!-- Speaker & Camera Notch -->
    <rect x="85" y="10" width="80" height="12" fill="#121212" rx="6"/>
    <circle cx="150" cy="16" r="2.5" fill="#333333"/>

    <!-- Screen Content -->
    <rect x="12" y="32" width="226" height="460" fill="#141412" rx="18"/>
    
    <!-- Mobile Header -->
    <rect x="22" y="45" width="206" height="28" fill="#1A1A18" rx="3"/>
    <text x="32" y="62" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#E5E4DE" font-weight="700">VALENTINA ALEMÁN</text>
    <rect x="185" y="52" width="32" height="14" fill="#C2C416" rx="2"/>
    <text x="201" y="62" font-family="'JetBrains Mono', monospace" font-size="7" fill="#151515" font-weight="700" text-anchor="middle">MENU</text>

    <!-- Mobile Hero Block -->
    <rect x="22" y="82" width="206" height="95" fill="#1E1E1C" stroke="#2E2E2A" rx="3"/>
    <text x="30" y="100" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#F5F5F0" font-weight="700">Different problems.</text>
    <text x="30" y="115" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#C2C416" font-style="italic" font-weight="700">Different outputs.</text>
    <rect x="30" y="125" width="25" height="2" fill="#C2C416"/>
    <rect x="30" y="138" width="90" height="22" fill="#2A2A2A" stroke="#C2C416" rx="2"/>
    <text x="75" y="152" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#E5E4DE" text-anchor="middle">EXPLORE WORK</text>

    <!-- Mobile Media Card -->
    <rect x="22" y="186" width="206" height="135" fill="#111110" stroke="#333330" rx="3"/>
    <rect x="30" y="196" width="190" height="95" fill="#1E1E1C" rx="2"/>
    <text x="125" y="248" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#C2C416" text-anchor="middle">4:3 GATEWAY CARD</text>
    <text x="32" y="306" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#E5E4DE" font-weight="700">HARINANA</text>
    <text x="32" y="316" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#888880">Brand Strategy · Packaging</text>

    <!-- Floating Audio Coordinator -->
    <rect x="22" y="332" width="206" height="38" fill="#1A1A18" stroke="#C2C416" stroke-width="1" rx="4"/>
    <circle cx="40" cy="351" r="9" fill="#C2C416"/>
    <polygon points="38,347 44,351 38,355" fill="#151515"/>
    <text x="56" y="348" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#E5E4DE" font-weight="700">RADIO // SYNPHAERA</text>
    <text x="56" y="359" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#888880">Ambient Sound · Unblocked Stream</text>

    <text x="125" y="475" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#555550" text-anchor="middle">[ PLACEHOLDER: MOBILE CAPTURE ]</text>
  </g>

  <!-- Technical Specs & Performance Panel -->
  <g transform="translate(350, 40)">
    <rect width="390" height="510" fill="#181816" stroke="#2C2C28" stroke-width="1.5" rx="8"/>
    
    <rect x="0" y="0" width="390" height="40" fill="#20201D" rx="8"/>
    <rect x="0" y="30" width="390" height="10" fill="#20201D"/>
    <text x="20" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700">PERFORMANCE &amp; ARCHITECTURE AUDIT</text>

    <!-- Metric 01 -->
    <g transform="translate(20, 60)">
      <rect width="350" height="70" fill="#141412" stroke="#2A2A2A" rx="4"/>
      <text x="15" y="26" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#00D26A" font-weight="700">100 / 100</text>
      <text x="105" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE" font-weight="700">LIGHTHOUSE CORE VITALS</text>
      <text x="15" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#888880">Zero heavy JS frameworks. Pure semantic HTML5, modern CSS3 variables, and vanilla runtime.</text>
    </g>

    <!-- Metric 02 -->
    <g transform="translate(20, 145)">
      <rect width="350" height="70" fill="#141412" stroke="#2A2A2A" rx="4"/>
      <text x="15" y="26" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#C2C416" font-weight="700">FASTSTART</text>
      <text x="125" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE" font-weight="700">OPTIMIZED MP4 STREAMING</text>
      <text x="15" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#888880">moov atom relocation before mdat chunk. Sub-millisecond instant playback with zero buffer lag.</text>
    </g>

    <!-- Metric 03 -->
    <g transform="translate(20, 230)">
      <rect width="350" height="70" fill="#141412" stroke="#2A2A2A" rx="4"/>
      <text x="15" y="26" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#E5E4DE" font-weight="700">ZERO ORB</text>
      <text x="125" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE" font-weight="700">AUDIO REFERRER HARDENING</text>
      <text x="15" y="48" font-family="'Inter', sans-serif" font-size="10" fill="#888880">Strict no-referrer policy bypassing remote Icecast 403 firewalls for uninterrupted ambient radio.</text>
    </g>

    <!-- Metric 04 -->
    <g transform="translate(20, 315)">
      <rect width="350" height="85" fill="#141412" stroke="#C2C416" stroke-width="1" rx="4"/>
      <text x="15" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#C2C416" font-weight="700">CLIENT COMMERCIAL SERVICE</text>
      <text x="15" y="48" font-family="'Inter', sans-serif" font-size="10.5" fill="#E5E4DE">We build high-performance web presences, interactive case decks, and brand platforms for ventures and leaders.</text>
      <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#888880">&gt; Available for collaborative project bookings</text>
    </g>

    <!-- Summary Footnote -->
    <text x="20" y="440" font-family="'JetBrains Mono', monospace" font-size="9" fill="#666660">WIREFRAME 02-B · MOBILE &amp; AUDIO SYSTEM AUDIT</text>
    <text x="20" y="460" font-family="'JetBrains Mono', monospace" font-size="9" fill="#666660">READY FOR VIDEO OR INTERFACE SCREEN RECORDINGS</text>
  </g>
</svg>
