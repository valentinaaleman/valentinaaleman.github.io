<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2C416" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#151515" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#151515"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Border & Frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#2A2A2A" stroke-width="1.5" rx="8"/>

  <!-- Top System Bar -->
  <rect x="24" y="24" width="752" height="42" fill="#1A1A1A" rx="8"/>
  <rect x="24" y="58" width="752" height="8" fill="#1A1A1A"/>
  <line x1="24" y1="66" x2="776" y2="66" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="50" cy="45" r="5" fill="#333333"/>
  <circle cx="68" cy="45" r="5" fill="#333333"/>
  <circle cx="86" cy="45" r="5" fill="#C2C416"/>

  <text x="110" y="49" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888880" letter-spacing="1.5">valentinaaleman.github.io / branch: main</text>
  <text x="750" y="49" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" text-anchor="end" font-weight="600">LIVE SYSTEM · 06</text>

  <!-- Central Wireframe Blueprint -->
  <g transform="translate(60, 100)">
