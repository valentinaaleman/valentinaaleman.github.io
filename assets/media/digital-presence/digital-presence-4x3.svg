    <rect x="0" y="0" width="680" height="50" fill="#1C1C1A" stroke="#333330" stroke-width="1" rx="4"/>
    <text x="24" y="31" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#E5E4DE" font-weight="700" letter-spacing="1">VALENTINA ALEMÁN</text>
    <rect x="520" y="14" width="136" height="22" fill="#C2C416" rx="3"/>
    <text x="588" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#151515" font-weight="700" text-anchor="middle" letter-spacing="0.5">DEPLOYED</text>

    <!-- Blueprint Split View -->
    <!-- Left Column: Strategy & AI Engine -->
    <rect x="0" y="70" width="325" height="340" fill="#1A1A18" stroke="#2E2E2A" stroke-width="1" rx="4"/>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700" letter-spacing="1.5">// WORKFLOW CORE</text>
    <text x="20" y="128" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#F5F5F0" font-weight="700">Digital Presence</text>
    <text x="20" y="152" font-family="'Inter', sans-serif" font-size="12" fill="#888880">AI-Augmented Creative Studio</text>

    <line x1="20" y1="172" x2="305" y2="172" stroke="#2A2A2A" stroke-width="1"/>

    <!-- Process Nodes -->
    <rect x="20" y="190" width="285" height="32" fill="#222220" stroke="#333330" rx="3"/>
    <text x="32" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE">01 / BRAND &amp; PRODUCT STRATEGY</text>

    <rect x="20" y="232" width="285" height="32" fill="#222220" stroke="#C2C416" stroke-width="1" rx="3"/>
    <text x="32" y="252" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C2C416">02 / AI-POWERED DEV PIPELINE</text>

    <rect x="20" y="274" width="285" height="32" fill="#222220" stroke="#333330" rx="3"/>
    <text x="32" y="294" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE">03 / MULTIDISCIPLINARY TALENT</text>

    <rect x="20" y="316" width="285" height="32" fill="#222220" stroke="#333330" rx="3"/>
    <text x="32" y="336" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E5E4DE">04 / DECENTRALIZED GIT / CI-CD</text>

    <text x="20" y="385" font-family="'JetBrains Mono', monospace" font-size="10" fill="#666660">STATUS: PRODUCTION READY</text>

    <!-- Right Column: Interactive Output Preview -->
    <rect x="355" y="70" width="325" height="340" fill="#1A1A18" stroke="#2E2E2A" stroke-width="1" rx="4"/>
    <text x="375" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700" letter-spacing="1.5">// DIGITAL ECOSYSTEM</text>
    
    <!-- Miniature Hero Screen -->
    <rect x="375" y="118" width="285" height="150" fill="#151515" stroke="#333330" rx="3"/>
    <rect x="390" y="138" width="120" height="14" fill="#C2C416" rx="2"/>
    <rect x="390" y="160" width="220" height="8" fill="#333333" rx="1"/>
    <rect x="390" y="174" width="180" height="8" fill="#333333" rx="1"/>
    <rect x="390" y="188" width="140" height="8" fill="#333333" rx="1"/>
    <circle cx="585" cy="180" r="32" fill="#222222" stroke="#C2C416" stroke-dasharray="2 2"/>
    <text x="585" y="184" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C2C416" text-anchor="middle">LIVE UI</text>

    <!-- Code & Git Feed -->
    <rect x="375" y="280" width="285" height="110" fill="#121212" stroke="#252525" rx="3"/>
    <text x="390" y="302" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#888880">&gt; git commit -m &quot;feat: living ecosystem&quot;</text>
    <text x="390" y="322" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#C2C416">&gt; build: zero-bloat vanilla stack</text>
    <text x="390" y="342" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#888880">&gt; team: strategy + ai + design + code</text>
    <text x="390" y="362" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#00D26A">&gt; status: 100% automated deployment</text>
  </g>

  <!-- Bottom Accent Tag -->
  <text x="60" y="550" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666660" letter-spacing="1">4:3 GATEWAY WIREFRAME · READY FOR SCREEN CAPTURE OR MEDIA REPLACEMENT</text>
  <rect x="710" y="538" width="30" height="16" fill="#C2C416" rx="2"/>
  <text x="725" y="550" font-family="'JetBrains Mono', monospace" font-size="9" fill="#151515" font-weight="700" text-anchor="middle">06</text>
</svg>
