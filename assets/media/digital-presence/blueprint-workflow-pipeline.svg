      <rect y="60" width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Micro-Feedback Cycles</text>

      <rect y="120" width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Creative QA &amp; Brand Polish</text>
    </g>

    <!-- Connector Arrow 3 -->
    <path d="M 828 225 L 862 225" stroke="#C2C416" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="862,221 870,225 862,229" fill="#C2C416"/>

    <!-- Stage 04: Git / Continuous Deployment -->
    <rect x="870" y="0" width="230" height="450" fill="#191917" stroke="#333330" stroke-width="1.5" rx="6"/>
