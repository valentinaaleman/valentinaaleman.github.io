      <text x="12" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Sub-second Performance</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 538 225 L 572 225" stroke="#C2C416" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="572,221 580,225 572,229" fill="#C2C416"/>

    <!-- Stage 03: Multidisciplinary Collaboration -->
    <rect x="580" y="0" width="240" height="450" fill="#191917" stroke="#333330" stroke-width="1.5" rx="6"/>
