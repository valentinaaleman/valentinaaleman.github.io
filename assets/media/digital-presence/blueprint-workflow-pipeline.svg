      <rect y="60" width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Automated Asset Remuxing</text>

