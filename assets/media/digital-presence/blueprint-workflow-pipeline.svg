  <circle cx="58" cy="52" r="5" fill="#3A3A36"/>
  <circle cx="76" cy="52" r="5" fill="#3A3A36"/>
  <circle cx="94" cy="52" r="5" fill="#C2C416"/>
  <text x="120" y="56" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8E8E88" letter-spacing="1">SYSTEM WORKFLOW PIPELINE // STRATEGY → AI ENGINEERING → DEPLOYMENT</text>
  <text x="1140" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700" text-anchor="end">[ PLACEHOLDER: BLUEPRINT WIREFRAME 01 ]</text>

  <!-- Main Pipeline Container -->
  <g transform="translate(50, 110)">
    <!-- Stage 01: Product & Brand Strategy -->
    <rect x="0" y="0" width="240" height="450" fill="#191917" stroke="#333330" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="240" height="38" fill="#222220" rx="6"/>
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700">STAGE 01 / STRATEGY</text>
    <text x="20" y="70" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#F5F5F0" font-weight="700">Brand Truth &amp;<br/>System Narrative</text>
    <text x="20" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888880" line-height="1.5">Distilling founder vision and product DNA into uncompromised strategic clarity before writing a single line of code.</text>
    
    <g transform="translate(15, 200)">
      <rect width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="28" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Audience &amp; Behavior Map</text>
      
      <rect y="60" width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Positioning &amp; Value Engine</text>

      <rect y="120" width="210" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Design Token Architecture</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 248 225 L 282 225" stroke="#C2C416" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="282,221 290,225 282,229" fill="#C2C416"/>

    <!-- Stage 02: AI-Augmented Engineering -->
    <rect x="290" y="0" width="240" height="450" fill="#191917" stroke="#C2C416" stroke-width="1.5" rx="6"/>
    <rect x="290" y="0" width="240" height="38" fill="#242510" rx="6"/>
    <text x="310" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700">STAGE 02 / AI ORCHESTRATION</text>
    <text x="310" y="70" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#F5F5F0" font-weight="700">Human Leadership +<br/>AI Velocity</text>
    <text x="310" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888880">Pairing creative director vision with state-of-the-art AI code synthesis, instant refactoring, and zero-bloat builds.</text>

    <g transform="translate(305, 200)">
      <rect width="210" height="48" fill="#151515" stroke="#C2C416" stroke-width="1" rx="4"/>
