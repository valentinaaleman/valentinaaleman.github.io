      <rect y="60" width="200" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E5E4DE">• Immutable Git History</text>

      <rect y="120" width="200" height="48" fill="#151515" stroke="#2A2A2A" rx="4"/>
      <text x="12" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#00D26A">• Live Commercial Service</text>
