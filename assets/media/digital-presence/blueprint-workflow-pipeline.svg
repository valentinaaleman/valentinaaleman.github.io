  <text x="50" y="627" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888880">MODEL: SQUAD-AS-A-SERVICE // PROPRIETARY METHODOLOGY FOR DIGITAL VENTURES &amp; PORTFOLIOS</text>
  <text x="1150" y="627" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700" text-anchor="end">STATUS: ACTIVE OFFERING ↗</text>
