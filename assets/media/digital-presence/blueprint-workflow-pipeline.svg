    <text x="890" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C2C416" font-weight="700">STAGE 04 / LIVING PLATFORM</text>
    <text x="890" y="70" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#F5F5F0" font-weight="700">GitHub CI-CD &amp;<br/>Living Service</text>
    <text x="890" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888880">Deploying directly to high-availability infrastructure with versioned iterations, zero vendor lock-in, and full client autonomy.</text>

    <g transform="translate(885, 200)">
